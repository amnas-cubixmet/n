name: Verify full mobile GSAP audit

on:
  push:
    branches:
      - fix/mobile-gsap-full-audit

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
