name: Verify mobile What We Do scroll animation

on:
  push:
    branches:
      - fix/mobile-what-we-do-scroll-animation

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
